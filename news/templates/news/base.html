<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsroom</title><style>body{font:1rem/1.6 system-ui;max-width:65rem;margin:auto;padding:1rem;color:#182a3c;background:#f4f6f8}article{padding:1rem;background:white;margin:1rem 0;border:1px solid #ccd4dc}nav{display:flex;flex-wrap:wrap;gap:1rem}label{display:block}input,textarea,select,button{font:inherit;max-width:100%}a{color:#08518b}</style></head><body><header><h1>Newsroom</h1><nav><a href="{% url 'home' %}">Home</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a><a href="{% url 'register' %}">Register</a>{% endif %}</nav></header>{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}<main>{% block content %}{% endblock %}</main></body></html>
